http_port 3128
visible_hostname squid.testbed.test
acl testbed_destinations dstdomain .testbed.test
acl safe_ports port 80
http_access deny !safe_ports
http_access allow testbed_destinations
http_access deny all
# Keep fault/replication scenarios deterministic while still caching real data.
acl mutable_metadata urlpath_regex /\.cvmfspublished$ /\.cvmfs_status\.json$ /\.cvmfswhitelist$ ^/cvmfs/info/
cache deny mutable_metadata
cache_mem 16 MB
maximum_object_size 16 MB
maximum_object_size_in_memory 128 KB
cache_dir ufs /var/spool/squid 64 16 256
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /run/squid/squid.pid
minimum_expiry_time 0
shutdown_lifetime 1 seconds
