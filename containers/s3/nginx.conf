map $uri $testbed_cache_control {
    ~^/cvmfs/[^/]+/data/ "public, max-age=31536000, immutable";
    default "max-age=0, must-revalidate";
}
server {
    listen 80;
    server_name _;
    # Static S3 deployments have no CernVM-FS discovery or GeoAPI service.
    location /cvmfs/info/ { return 404; }
    location /cvmfs/ {
        resolver TESTBED_DNS_RESOLVER valid=5s ipv6=off;
        set $storage http://object-store:8333;
        proxy_pass $storage$request_uri;
        proxy_set_header Host object-store:8333;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # Cache immutable objects; revalidate mutable repository metadata.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $testbed_cache_control;
    }
}
